<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page Not Found — Spin Vinyl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0b0c0f;
      color: #e8e0d0;
      font-family: Inter, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ── Header ── */
    .page-header {
      background: #0d0d11;
      border-bottom: 1px solid #1e1c24;
      padding: 14px 24px;
    }
    .page-header a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .page-header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .brand {
      font-family: Jost, sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #e8e0d0;
      letter-spacing: 0.04em;
    }
    .brand em {
      font-style: normal;
      color: #c9a84c;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
      text-align: center;
    }

    /* ── SVG record ── */
    .record-wrap {
      margin-bottom: 44px;
      animation: slowspin 12s linear infinite;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,0.7));
    }
    @keyframes slowspin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Copy ── */
    .error-code {
      font-family: Jost, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 14px;
    }
    h1 {
      font-family: Jost, sans-serif;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 700;
      color: #e8e0d0;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      font-size: 15px;
      color: #6b6470;
      max-width: 360px;
      margin-bottom: 40px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #c9a84c;
      color: #0b0c0f;
      font-family: Jost, sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 30px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s, transform 0.12s;
    }
    .btn-home:hover {
      background: #d4b660;
      transform: translateY(-2px);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #1e1c24;
      padding: 18px 24px;
      text-align: center;
      font-size: 12px;
      color: #3a3840;
    }
    footer a {
      color: #6b6470;
      text-decoration: none;
      margin: 0 8px;
      transition: color 0.15s;
    }
    footer a:hover { color: #c9a84c; }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="/">
      <img src="icon-192.png" alt="Spin Vinyl logo" />
      <span class="brand">Spin <em>Vinyl</em></span>
    </a>
  </header>

  <main>

    <!-- Gold vinyl record SVG -->
    <div class="record-wrap" aria-hidden="true">
      <svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gold radial gradient for the record body -->
          <radialGradient id="goldBody" cx="50%" cy="42%" r="52%">
            <stop offset="0%"   stop-color="#e8c96a"/>
            <stop offset="35%"  stop-color="#c9a84c"/>
            <stop offset="65%"  stop-color="#a8853a"/>
            <stop offset="100%" stop-color="#8a6a28"/>
          </radialGradient>
          <!-- Darker gold for groove areas -->
          <radialGradient id="grooveTint" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0"/>
            <stop offset="100%" stop-color="#5a3e10" stop-opacity="0.5"/>
          </radialGradient>
          <!-- Label gradient -->
          <radialGradient id="labelGrad" cx="50%" cy="40%" r="55%">
            <stop offset="0%"   stop-color="#1e1c24"/>
            <stop offset="100%" stop-color="#0d0c12"/>
          </radialGradient>
        </defs>

        <!-- Outer record disc -->
        <circle cx="110" cy="110" r="108" fill="url(#goldBody)"/>

        <!-- Groove rings — alternating dark/light for realism -->
        <circle cx="110" cy="110" r="105" fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="102" fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.6"/>
        <circle cx="110" cy="110" r="99"  fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="96"  fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.6"/>
        <circle cx="110" cy="110" r="93"  fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="90"  fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.6"/>
        <circle cx="110" cy="110" r="87"  fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="84"  fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.5"/>
        <circle cx="110" cy="110" r="81"  fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="78"  fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.5"/>
        <circle cx="110" cy="110" r="75"  fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="72"  fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.4"/>
        <circle cx="110" cy="110" r="69"  fill="none" stroke="#8a6a28" stroke-width="0.5"/>
        <circle cx="110" cy="110" r="66"  fill="none" stroke="#e0ba55" stroke-width="0.4" opacity="0.4"/>

        <!-- Depth overlay -->
        <circle cx="110" cy="110" r="108" fill="url(#grooveTint)"/>

        <!-- Edge highlight -->
        <circle cx="110" cy="110" r="107" fill="none" stroke="#f0d070" stroke-width="0.8" opacity="0.4"/>

        <!-- Centre label -->
        <circle cx="110" cy="110" r="46" fill="url(#labelGrad)"/>
        <circle cx="110" cy="110" r="46" fill="none" stroke="#2a2830" stroke-width="1"/>

        <!-- Label inner ring decoration -->
        <circle cx="110" cy="110" r="40" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>

        <!-- "Spin" text on label -->
        <text x="110" y="103" text-anchor="middle"
              font-family="Jost, sans-serif" font-weight="700" font-size="13"
              fill="#e8e0d0" letter-spacing="1">Spin</text>

        <!-- "VINYL" text on label -->
        <text x="110" y="119" text-anchor="middle"
              font-family="Jost, sans-serif" font-weight="500" font-size="8"
              fill="#c9a84c" letter-spacing="3">VINYL</text>

        <!-- Spindle hole -->
        <circle cx="110" cy="110" r="4" fill="#0b0c0f"/>
        <circle cx="110" cy="110" r="2" fill="#c9a84c"/>
      </svg>
    </div>

    <p class="error-code">404 — Not Found</p>
    <h1>This record isn't in the crates.</h1>
    <p>The page you're looking for doesn't exist, may have moved, or the needle skipped.</p>

    <a href="/" class="btn-home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      Back to my collection
    </a>

  </main>

  <footer>
    <a href="/">Home</a>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Service</a>
    &nbsp;·&nbsp; © 2025 Spin Vinyl
  </footer>

</body>
</html>
