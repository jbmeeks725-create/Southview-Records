<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connecting Spotify… — SPIN VINYL</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0c0f;
    color: #f3e3c3;
    font-family: "Jost", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .callback-card {
    text-align: center;
    max-width: 360px;
    padding: 32px;
  }
  .callback-card h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .callback-card p {
    font-size: 0.9rem;
    color: rgba(243, 227, 195, 0.7);
    line-height: 1.5;
    margin: 0;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(202, 161, 90, 0.25);
    border-top-color: #caa15a;
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .callback-card.error .spinner { display: none; }
  .callback-card.error h1 { color: #e07a5f; }
</style>
</head>
<body>
  <div class="callback-card" id="callbackCard">
    <div class="spinner" id="callbackSpinner"></div>
    <h1 id="callbackTitle">Connecting your Spotify account…</h1>
    <p id="callbackMessage">Just a moment, this window will close automatically.</p>
  </div>

  <!-- Supabase client, same version/setup as the main app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // These must match the values in app.js exactly.
    const SUPABASE_URL = "https://wdgiskawukblqgapkmig.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KkcpYXwoOXi2XVv-UqIoiw_5G8q21CT";
    const SPOTIFY_CLIENT_ID = "abce6ebe89b248b796cd64532ce397a7";
    const SPOTIFY_REDIRECT_URI = "https://spinvinyl.co/spotify-callback.html";
    const SPOTIFY_AUTH_FUNCTION_URL = "https://wdgiskawukblqgapkmig.supabase.co/functions/v1/spotify-auth";
    const SPOTIFY_TOKEN_URL = "https://accounts.spotify.com/api/token";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showError(message) {
      const card = document.getElementById("callbackCard");
      const title = document.getElementById("callbackTitle");
      const msg = document.getElementById("callbackMessage");
      card.classList.add("error");
      title.textContent = "Couldn't connect Spotify";
      msg.textContent = message;
    }

    function finishAndClose(success) {
      const title = document.getElementById("callbackTitle");
      const msg = document.getElementById("callbackMessage");
      const spinner = document.getElementById("callbackSpinner");
      spinner.style.display = "none";
      title.textContent = success ? "Spotify connected!" : "Couldn't connect Spotify";

      // If this was opened as a popup from the main app, let the opener
      // know and close automatically. Otherwise (e.g. redirect happened
      // in the same tab), send the person back to the room after a beat.
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "spotify-auth-complete", success }, "*");
        msg.textContent = "You can close this window.";
        setTimeout(() => window.close(), 1200);
      } else {
        msg.textContent = "Taking you back to SPIN VINYL…";
        setTimeout(() => {
          window.location.href = "/index.html#room";
        }, 1200);
      }
    }

    async function run() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");

      if (error) {
        showError(
          error === "access_denied"
            ? "You declined the Spotify authorization request."
            : `Spotify returned an error: ${error}`
        );
        return;
      }

      if (!code) {
        showError("No authorization code was returned by Spotify.");
        return;
      }

      const codeVerifier = sessionStorage.getItem("spotify_code_verifier");
      if (!codeVerifier) {
        showError(
          "This page was opened without an active connection attempt. Go back to SPIN VINYL and click \u201cConnect Spotify\u201d again."
        );
        return;
      }

      // Must have an active Supabase session — this whole flow only ever
      // runs for the signed-in site owner.
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const accessToken = sessionData?.session?.access_token;
      if (!accessToken) {
        showError("Your SPIN VINYL session expired. Sign back in and try connecting again.");
        return;
      }

      try {
        const response = await fetch(SPOTIFY_AUTH_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${accessToken}`,
          },
          body: JSON.stringify({
            action: "exchange",
            code,
            code_verifier: codeVerifier,
          }),
        });

        const result = await response.json();

        if (!response.ok || !result.connected) {
          throw new Error(result.error || "Token exchange failed");
        }

        sessionStorage.removeItem("spotify_code_verifier");
        finishAndClose(true);
      } catch (err) {
        console.error(err);
        showError(err.message || "Something went wrong finishing the Spotify connection.");
      }
    }

    run();
  </script>
</body>
</html>
